<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klikk meg ;-)</title>
    <link rel="stylesheet" href="klikkmeg.css">
    <link rel="icon" type="image/x-icon" href="/media/wink.png">
    <script>
        function jump() {
            let knapp = document.querySelector("#knapp"); 
            /* knapp er en variabel type object */
            /* = er en tilordningsoperator */
            let xx = Math.floor(Math.random() * Math.max(0, window.innerWidth - knapp.offsetWidth)); 
            /* xx er en variabel type heltall/integer (blir avrundet av .floor) */
            /* .innerWidth er en egenskap for window, som sjekker bredde (og høyde) på nettleser-vindu */
            let yy = Math.floor(Math.random() * Math.max(0, window.innerHeight - knapp.offsetHeight));
            knapp.style.top = yy + "px";
            knapp.style.left = xx + "px";
            knapp.getAnimations().forEach(animation => animation.cancel()); 
            /* .getAnimations() er en metode for css-manipulering */
            /* .forEach() er en kontrollstruktur/løkkesetning, tilsvarer while() */
            knapp.animate(
                [{ backgroundColor: "#fff9e8" }, { backgroundColor: "var(--acc)" }],
                { duration: 750, fill: "forwards" }
            );
        }
    </script>
</head>
<body>
    <div>
        <h1 style="border: 0px;">Klikk meg ;-)</h1>
        Klikk den gule knappen under ;-)
    </div>
    <button class="knapp" onmouseover="jump()" id="knapp" style="background-color: var(--acc);">Klikk meg ;-)</button>
</body>
</html>
